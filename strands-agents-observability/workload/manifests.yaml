apiVersion: v1
kind: Namespace
metadata:
  name: workload
---
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: workload
type: Opaque
stringData:
  DB_PASSWORD: demo123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-code
  namespace: workload
data:
  server.py: |
    import os, http.server, socketserver, json
    try:
        import redis as r
    except ImportError:
        import subprocess, sys
        subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "redis"])
        import redis as r

    db_pw = os.environ["DB_PASSWORD"]
    rc = r.Redis(host="redis", port=6379, socket_connect_timeout=3)

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                rc.ping()
                self.send_response(200)
                self.end_headers()
                self.wfile.write(json.dumps({"status": "ok", "redis": "connected"}).encode())
            except Exception as e:
                self.send_response(502)
                self.end_headers()
                self.wfile.write(json.dumps({"status": "error", "detail": str(e)}).encode())

    print("Starting server on :8080")
    socketserver.TCPServer(("", 8080), Handler).serve_forever()
---
# --- Redis + exporter ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
        - name: exporter
          image: oliver006/redis_exporter:v1.67.0-alpine
          ports:
            - containerPort: 9121
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: workload
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: workload
spec:
  selector:
    app: redis
  ports:
    - port: 9121
      targetPort: 9121
---
# --- Sample App ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          ports:
            - containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-creds
                  key: DB_PASSWORD
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: code
          configMap:
            name: sample-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: workload
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 8080
---
# --- Nginx + exporter ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.4
          args: ["-nginx.scrape-uri=http://localhost/stub_status"]
          ports:
            - containerPort: 9113
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: workload
data:
  default.conf: |
    server {
        listen 80;
        location / { proxy_pass http://sample-app; }
        location /health { return 200 'ok'; }
        location /stub_status { stub_status; allow 127.0.0.1; deny all; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: workload
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-exporter
  namespace: workload
spec:
  selector:
    app: nginx
  ports:
    - port: 9113
      targetPort: 9113
