apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jaegertracing
  namespace: observability
spec:
  interval: 24h
  url: https://jaegertracing.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: observability
spec:
  interval: 24h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jaeger
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: jaeger
      sourceRef:
        kind: HelmRepository
        name: jaegertracing
        namespace: observability
      interval: 12h
  values:
    provisionDataStore:
      cassandra: false
    allInOne:
      enabled: true
    storage:
      type: memory
    agent:
      enabled: false
    collector:
      enabled: false
    query:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: prometheus
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
      interval: 12h
  values:
    alertmanager:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    server:
      persistentVolume:
        enabled: false
    extraScrapeConfigs: |
      - job_name: otel-collector
        scrape_interval: 15s
        static_configs:
          - targets: ['otel-collector-opentelemetry-collector:8889']
      - job_name: vllm
        scrape_interval: 15s
        static_configs:
          - targets: ['vllm-svc.vllm:8000']
      - job_name: redis
        scrape_interval: 15s
        static_configs:
          - targets: ['redis-exporter.workload:9121']
      - job_name: nginx
        scrape_interval: 15s
        static_configs:
          - targets: ['nginx-exporter.workload:9113']
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: observability
      interval: 12h
  values:
    mode: deployment
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      connectors:
        spanmetrics:
          namespace: agent_obs
      exporters:
        otlp/jaeger:
          endpoint: jaeger-collector:4317
          tls:
            insecure: true
        prometheus:
          endpoint: 0.0.0.0:8889
          namespace: agent_obs
      service:
        pipelines:
          traces:
            receivers: [otlp]
            exporters: [otlp/jaeger, spanmetrics]
          metrics:
            receivers: [spanmetrics]
            exporters: [prometheus]
    ports:
      metrics:
        enabled: true
        containerPort: 8889
        servicePort: 8889
        protocol: TCP
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
      interval: 12h
  values:
    adminPassword: agent-obs-demo
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            folder: ""
            type: file
            disableDeletion: false
            options:
              path: /var/lib/grafana/dashboards/default
    dashboardsConfigMaps:
      default: grafana-agent-dashboard
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Jaeger
            type: jaeger
            uid: jaeger
            url: http://jaeger:16686
            access: proxy
            isDefault: false
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus-server:80
            access: proxy
            isDefault: true
