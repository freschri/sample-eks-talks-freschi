<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRE Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
  .title { display: flex; align-items: center; gap: 10px; }
  .title h1 { font-size: 16px; font-weight: 600; }
  .title span { font-size: 12px; color: #8b949e; }
  #status { font-size: 12px; padding: 4px 10px; border-radius: 10px; background: #1a4731; color: #3fb950; }
  #log { flex: 1; overflow-y: auto; padding: 16px 20px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.8; }
  .ev { padding: 2px 0; border-bottom: 1px solid #161b22; }
  .ev.tool { color: #f0883e; }
  .ev.result { color: #8b949e; }
  .ev.think { color: #7ee787; }
  .ev.cycle { color: #58a6ff; font-weight: 600; margin-top: 8px; }
  .ev.fixer { color: #f0883e; font-weight: 500; }
  .ev.ok { color: #3fb950; font-weight: 600; }
  .ev.err { color: #f85149; }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1>🤖 SRE Agent</h1>
    <span>Autonomous detect → diagnose → fix</span>
  </div>
  <span id="status">Watching</span>
</header>
<div id="log"></div>
<script>
const log = document.getElementById('log');
let lastCount = 0;

function classify(text) {
  if (text.includes('Cycle') && text.includes('scanning')) return 'cycle';
  if (text.includes('Fixer agent')) return 'fixer';
  if (text.includes('🔧')) return 'tool';
  if (text.includes('✅') && text.includes('healthy')) return 'ok';
  if (text.includes('✅')) return 'result';
  if (text.includes('❌')) return 'err';
  if (text.includes('💭')) return 'think';
  return '';
}

function addEv(text) {
  const d = document.createElement('div');
  d.className = 'ev ' + classify(text);
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function poll() {
  try {
    const r = await fetch('/autofix/events');
    const d = await r.json();
    for (let i = lastCount; i < d.events.length; i++) addEv(d.events[i]);
    lastCount = d.events.length;
  } catch(e) {}
}

setInterval(poll, 2000);
poll();
</script>
</body>
</html>
